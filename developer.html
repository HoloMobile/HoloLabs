<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoloLabs | Developer-Environment</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(30, 41, 59, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #007bff;
            --secondary: #00d2ff;
            --danger: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }
        .card h2 {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .console {
            background: #010409;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            font-family: monospace;
            height: 180px;
            overflow-y: auto;
            color: #10b981;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        textarea {
            width: 100%;
            height: 300px;
            background: #010409;
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: var(--secondary);
        }
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-danger { background: var(--danger); }
        .btn-nav {
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            margin-right: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-nav:hover {
            background: rgba(255,255,255,0.2);
        }
        select {
            padding: 10px 15px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 15px;
            width: 250px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">HoloLabs // Dev-Environment</div>
            <div>
                <a href="index.html?bypass=true" class="btn-nav">Zur Startseite</a>
                <button class="btn btn-danger" onclick="logout()">Ausloggen</button>
            </div>
        </header>

        <div class="card">
            <h2>Live-Konsole & System-Logs</h2>
            <div class="console" id="console-output">
                [SYSTEM] Initialisiere Developer-Environment...<br>
                [SUPABASE] Verbindung erfolgreich hergestellt.<br>
                [STATUS] Bereit für Operationen.
            </div>
        </div>

        <div class="card">
            <h2>Code-Editor</h2>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Wähle eine Quelltextdatei aus, um sie direkt im Browser einzusehen und zu bearbeiten.</p>
            
            <select id="file-select" onchange="loadCodeFile()">
                <option value="index.html">index.html</option>
                <option value="admin.html">admin.html</option>
                <option value="developer.html">developer.html</option>
                <option value="login.html">login.html</option>
                <option value="datenschutz.html">datenschutz.html</option>
                <option value="impressum.html">impressum.html</option>
            </select>

            <textarea id="code-editor" placeholder="Lade Quelltext..."></textarea>
            <br><br>
            <button class="btn" onclick="saveCode()">Änderungen speichern</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhwlyuiughhvtopxplqe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Y6jlvYWTamP40tID3SUV-A_pUyc2qLv'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function checkDeveloperAccess() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                logToConsole('[FEHLER] Nicht eingeloggt.');
                document.getElementById('code-editor').value = '<!-- Zugriff verweigert: Nicht eingeloggt. Bitte logge dich über die Loginseite ein. -->';
                return;
            }

            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();

            if (error || !profile || profile.role !== 'developer') {
                logToConsole('[FEHLER] Zugriff verweigert (Keine Entwickler-Rechte).');
                document.getElementById('code-editor').value = '<!-- Zugriff verweigert! Nur für Entwickler. -->';
                // Automatischer Schutz: Umleitung bei fehlenden Rechten
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            } else {
                loadCodeFile();
            }
        }

        function logToConsole(message) {
            const consoleBox = document.getElementById('console-output');
            const time = new Date().toLocaleTimeString();
            const safeMsg = document.createElement('div');
            safeMsg.textContent = `[${time}] ${message}`;
            consoleBox.appendChild(safeMsg);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function loadCodeFile() {
            const fileName = document.getElementById('file-select').value;
            // Validierung gegen Pfad-Traversal
            if (!['index.html', 'admin.html', 'developer.html', 'login.html', 'impressum.html', 'datenschutz.html'].includes(fileName)) return;
            
            logToConsole(`Lade Datei: ${fileName}...`);
            
            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('Datei nicht gefunden');
                const text = await response.text();
                document.getElementById('code-editor').value = text;
                logToConsole(`Datei ${fileName} erfolgreich geladen.`);
            } catch (err) {
                logToConsole(`[FEHLER] Konnte ${fileName} nicht laden: ${err.message}`);
                document.getElementById('code-editor').value = '<!-- Fehler beim Laden des Quelltextes -->';
            }
        }

        function saveCode() {
            const fileName = document.getElementById('file-select').value;
            logToConsole(`[ERFOLG] Code für ${fileName} erfolgreich im Editor kompiliert und zwischengespeichert.`);
            alert(`Der Code für ${fileName} wurde zwischengespeichert! (Hinweis: Zum permanenten Live-Schalten bitte den Code in deine GitHub-Repository Datei einfügen).`);
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        checkDeveloperAccess();
    </script>
</body>
</html>
